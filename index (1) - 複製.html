<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>皮拉提斯備課</title>
<style>
:root{--bg:#EDF1EF;--card:#fff;--ink:#1E2B29;--sub:#6B7C79;--line:#D8E0DD;--acc:#2F6F6A;--acc2:#E4EFEC;--danger:#B4533F;--p0:#6FA394;--p1:#5F86B0;--p2:#B68AA2;--p3:#C2A25E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h2,h3,p{margin:0}
h2{font-size:20px}h3{font-size:17px}
button,input,select{font:inherit;color:inherit}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row.sm{font-size:15px;padding:2px 0}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.mh>button{width:40px;height:40px;border:0;background:var(--acc2);border-radius:50%;font-size:22px;color:var(--acc)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:13px;color:var(--sub);padding-bottom:4px}
.grid i{display:block}
.day{position:relative;height:44px;border:0;background:none;border-radius:10px;font-size:16px}
.day b{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.day.sel{background:var(--acc);color:#fff}.day.sel b{background:#fff}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;margin-top:10px}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.sm{width:auto;margin:0;padding:10px 16px;white-space:nowrap}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.mini{border:0;background:var(--acc2);color:var(--acc);border-radius:8px;padding:6px 10px;margin-left:4px;font-size:14px}
.danger{color:var(--danger)}
.lnk{border:0;background:none;margin-top:10px;font-size:14px;padding:6px 0}
.ph{border-left:5px solid var(--c,var(--acc))}
.ph>strong{display:block;margin:8px 0 2px}
.it{padding:10px 0;border-top:1px solid var(--line)}
.steps{display:flex;gap:16px;margin-top:6px;font-size:14px;color:var(--sub);align-items:center;flex-wrap:wrap}
.steps>span{display:flex;align-items:center;gap:6px}
.st{display:inline-flex;align-items:center;gap:2px}
.st button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px}
.st b{min-width:34px;text-align:center;color:var(--ink);font-size:16px}
.f{display:block;font-size:14px;color:var(--sub);margin-bottom:8px}
.f input,.f select,#newex{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:4px;color:var(--ink)}
.inl{display:flex;gap:6px;align-items:center}
.inl select{flex:1}
.inl .mini{margin:4px 0 0;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:75%;overflow:auto}
.pick{display:flex;justify-content:space-between;width:100%;padding:13px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--sub);font-size:15px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.big{text-align:center;border-top:5px solid var(--c)}
.clock{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;margin:10px 0}
.clock.over{color:var(--danger)}
.bar{height:8px;background:var(--acc2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<nav>
  <button data-act="tab" data-t="cal">日曆</button>
  <button data-act="tab" data-t="prep">備課</button>
  <button data-act="tab" data-t="prac">練習</button>
  <button data-act="tab" data-t="lib">動作庫</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=n=>Number.isInteger(n)?n:n.toFixed(1);
const half=s=>Math.max(0.5,Math.round(s/60*2)/2);
const clk=s=>{const a=Math.abs(s);return (s<0?'+':'')+pad(Math.floor(a/60))+':'+pad(a%60)};

/* ===== 資料（存在手機瀏覽器 localStorage）===== */
const KEY='pilatesPrep.v1';
const DEF=()=>({
  lib:[
    {id:uid(),name:'呼吸練習',sets:1,min:3},
    {id:uid(),name:'貓牛式',sets:3,min:3},
    {id:uid(),name:'胸椎扭轉',sets:2,min:3},
    {id:uid(),name:'高跪前推',sets:3,min:4},
    {id:uid(),name:'平移',sets:3,min:3},
    {id:uid(),name:'跪姿死蟲',sets:3,min:4}
  ],
  locs:['工作室 A','工作室 B'],
  lessons:{}
});
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.lib)S=DEF();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const now=new Date();
const ui={tab:'cal',y:now.getFullYear(),m:now.getMonth(),sel:ymd(now),sheet:null,prac:null};

const L=()=>S.lessons[ui.sel];
const mk=()=>{S.lessons[ui.sel]={loc:S.locs[0]||'',phases:['初期','中期','收尾'].map(n=>({id:uid(),name:n,items:[]}))};save()};
const total=l=>l.phases.reduce((a,p)=>a+p.items.reduce((b,i)=>b+i.min,0),0);
const flat=()=>{const l=L();return l?l.phases.flatMap((p,pi)=>p.items.map(it=>({...it,ph:p.name,pi}))):[]};
const stepper=(a,k,v,data)=>`<span class="st"><button data-act="${a}" data-k="${k}" data-n="-1" ${data}>−</button><b>${fmt(v)}</b><button data-act="${a}" data-k="${k}" data-n="1" ${data}>＋</button></span>`;

/* ===== 畫面 ===== */
function vCal(){
  const {y,m}=ui,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=ymd(new Date());
  let cells='';
  for(let i=0;i<first;i++)cells+='<i></i>';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`;
    cells+=`<button class="day ${k===ui.sel?'sel':''} ${k===t?'today':''}" data-act="pickday" data-d="${k}">${d}${S.lessons[k]?'<b></b>':''}</button>`;
  }
  return `<div class="card"><div class="mh"><button data-act="mon" data-n="-1">‹</button><h2>${y} 年 ${m+1} 月</h2><button data-act="mon" data-n="1">›</button></div>
  <div class="wk">${'日一二三四五六'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="grid">${cells}</div></div>`+vDay();
}
function vDay(){
  const l=L(),d=ui.sel;
  if(!l)return `<div class="card"><h3>${d}</h3><p class="sub">這天還沒有備課內容</p><button class="btn" data-act="goprep">開始備課</button></div>`;
  return `<div class="card"><h3>${d}</h3><p class="sub">📍 ${esc(l.loc||'未設定地點')} ・ 共 ${fmt(total(l))} 分鐘</p>
  ${l.phases.map((p,i)=>`<div class="ph" style="--c:var(--p${i%4})"><strong>${esc(p.name)}</strong>${p.items.length?p.items.map(it=>`<div class="row sm"><span>${esc(it.name)}</span><span class="sub">${it.sets} 組 ・ ${fmt(it.min)} 分</span></div>`).join(''):'<p class="sub">尚未加入動作</p>'}</div>`).join('')}
  <div class="btns"><button class="btn" data-act="goprep">編輯備課</button><button class="btn ghost" data-act="goprac">練習模式</button></div>
  <button class="lnk danger" data-act="dellesson">刪除這天的備課</button></div>`;
}
function vPrep(){
  const l=L();
  const head=`<div class="card"><label class="f">日期<input type="date" value="${ui.sel}" data-act="date"></label>`;
  if(!l)return head+`<p class="sub">這天還沒有備課</p><button class="btn" data-act="mk">建立備課（初期／中期／收尾）</button></div>`;
  const locs=S.locs.map(x=>`<option ${x===l.loc?'selected':''}>${esc(x)}</option>`).join('');
  return head+`<label class="f">地點<span class="inl"><select data-act="loc">${locs}</select><button class="mini" data-act="addloc">＋地點</button></span></label>
  <p class="sub">預估總時間 ${fmt(total(l))} 分鐘</p></div>`
  +l.phases.map((p,pi)=>`<div class="card ph" style="--c:var(--p${pi%4})">
    <div class="mh"><h3>${esc(p.name)} <span class="sub">${fmt(p.items.reduce((a,i)=>a+i.min,0))} 分</span></h3>
    <span><button class="mini" data-act="ren" data-p="${p.id}">改名</button><button class="mini danger" data-act="delph" data-p="${p.id}">刪除</button></span></div>
    ${p.items.map(it=>{const D=`data-p="${p.id}" data-i="${it.id}"`;return `<div class="it"><div class="row"><strong>${esc(it.name)}</strong>
      <span><button class="mini" data-act="mv" data-n="-1" ${D}>↑</button><button class="mini" data-act="mv" data-n="1" ${D}>↓</button><button class="mini danger" data-act="rm" ${D}>✕</button></span></div>
      <div class="steps"><span>組數 ${stepper('st','sets',it.sets,D)}</span><span>分鐘 ${stepper('st','min',it.min,D)}</span></div></div>`}).join('')}
    <button class="btn ghost" data-act="add" data-p="${p.id}">＋ 新增動作</button></div>`).join('')
  +`<button class="btn ghost" data-act="addph">＋ 新增階段</button>`;
}
function vSheet(){
  const l=L(),p=l&&l.phases.find(x=>x.id===ui.sheet);
  if(!p)return '';
  return `<div class="mask" data-act="mask"><div class="sheet"><div class="mh"><h3>加入到「${esc(p.name)}」</h3><button class="mini" data-act="closesheet">完成</button></div>
  ${S.lib.map(e=>`<button class="pick" data-act="pickex" data-e="${e.id}"><span>${esc(e.name)}</span><span class="sub">${e.sets} 組 ・ ${fmt(e.min)} 分</span></button>`).join('')||'<p class="sub">動作庫是空的</p>'}
  <button class="btn ghost" data-act="custom">＋ 自訂動作（同時存入動作庫）</button></div></div>`;
}
function vLib(){
  return `<div class="card"><h3>動作庫</h3><p class="sub">備課時從這裡挑動作，預設組數與分鐘可在此調整。</p>
  <div class="inl" style="margin-top:10px"><input id="newex" placeholder="新動作名稱"><button class="btn sm" data-act="addex">新增</button></div></div>
  <div class="card">${S.lib.map(e=>{const D=`data-e="${e.id}"`;return `<div class="it"><div class="row"><strong>${esc(e.name)}</strong><button class="mini danger" data-act="delex" ${D}>刪除</button></div>
  <div class="steps"><span>預設組數 ${stepper('stl','sets',e.sets,D)}</span><span>預設分鐘 ${stepper('stl','min',e.min,D)}</span></div></div>`}).join('')||'<p class="sub">還沒有動作</p>'}</div>
  <div class="card"><h3>地點</h3>${S.locs.map((x,i)=>`<div class="row sm" style="padding:6px 0"><span>${esc(x)}</span><button class="mini danger" data-act="delloc" data-n="${i}">刪除</button></div>`).join('')}
  <button class="btn ghost" data-act="addloc2">＋ 新增地點</button></div>`;
}
function vPrac(){
  const its=flat(),l=L();
  if(!its.length)return `<div class="card"><h3>練習模式</h3><p class="sub">${ui.sel} 還沒有可練習的動作，先到「備課」加入動作吧。</p><button class="btn" data-act="goprep">去備課</button></div>`;
  const p=ui.prac&&ui.prac.date===ui.sel?ui.prac:null;
  if(!p)return `<div class="card"><h3>練習模式</h3><p class="sub">${ui.sel} ・ ${its.length} 個動作 ・ 預估 ${fmt(total(l))} 分鐘</p>
  <p class="sub" style="margin-top:6px">依序倒數每個動作的預估時間，並記錄你實際花的時間。</p><button class="btn" data-act="pstart">開始練習</button></div>`;
  if(p.done){
    const act=its.reduce((a,_,i)=>a+(p.el[i]||0),0);
    return `<div class="card"><h3>練習完成</h3><p class="sub">預估 ${fmt(total(l))} 分 ・ 實際 ${fmt(Math.round(act/6)/10)} 分</p>
    <table><tr><th>動作</th><th>預估</th><th>實際</th></tr>${its.map((it,i)=>`<tr><td>${esc(it.name)}</td><td>${fmt(it.min)}</td><td>${p.el[i]?fmt(half(p.el[i])):'-'}</td></tr>`).join('')}</table>
    <button class="btn" data-act="papply">用實際時間更新預估</button><button class="btn ghost" data-act="pstart">重新練習</button></div>`;
  }
  const it=its[p.i],T=it.min*60,last=p.i===its.length-1;
  return `<div class="card big" style="--c:var(--p${it.pi%4})"><p class="sub">${esc(it.ph)} ・ 第 ${p.i+1}/${its.length} 個</p><h2 style="margin-top:4px">${esc(it.name)}</h2>
  <p class="sub">${it.sets} 組 ・ 預估 ${fmt(it.min)} 分</p>
  <div id="clock" class="clock ${p.left<0?'over':''}">${clk(p.left)}</div>
  <div class="bar"><i id="barfill" style="width:${Math.min(100,(p.el[p.i]||0)/T*100)}%"></i></div>
  <div class="btns" style="margin-top:14px"><button class="btn ghost" data-act="pprev">上一個</button><button class="btn" data-act="ptog">${p.run?'暫停':'繼續'}</button><button class="btn ghost" data-act="pnext">${last?'完成':'下一個'}</button></div></div>`;
}

const views={cal:vCal,prep:vPrep,prac:vPrac,lib:vLib};
function renderSheet(){$('#sheet').innerHTML=ui.sheet?vSheet():''}
function render(){
  $('#app').innerHTML=views[ui.tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===ui.tab));
  renderSheet();
}
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1100)}
function askName(msg,def){const n=prompt(msg,def||'');return n&&n.trim()?n.trim():null}

/* ===== 練習計時 ===== */
function go(n){
  const p=ui.prac,its=flat();
  if(n>=its.length){p.done=true;p.run=false}
  else if(n>=0){p.i=n;p.left=its[n].min*60-(p.el[n]||0);p.t=Date.now()}
}
setInterval(()=>{
  const p=ui.prac;if(!p||!p.run||p.done)return;
  const d=Math.floor((Date.now()-p.t)/1000);if(d<1)return;
  p.t+=d*1000;p.el[p.i]=(p.el[p.i]||0)+d;p.left-=d;
  const c=$('#clock');if(!c)return;
  c.textContent=clk(p.left);c.classList.toggle('over',p.left<0);
  const it=flat()[p.i];if(it)$('#barfill').style.width=Math.min(100,p.el[p.i]/(it.min*60)*100)+'%';
},250);

/* ===== 事件 ===== */
function act(a,d){
  const l=L();
  const ph=()=>l.phases.find(p=>p.id===d.p);
  const item=()=>ph().items.find(i=>i.id===d.i);
  switch(a){
    case'tab':ui.tab=d.t;break;
    case'mon':{let m=ui.m+ +d.n,y=ui.y;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.m=m;ui.y=y;break}
    case'pickday':ui.sel=d.d;break;
    case'goprep':ui.tab='prep';break;
    case'goprac':ui.tab='prac';break;
    case'mk':mk();break;
    case'dellesson':if(!confirm('刪除這天的備課？'))return;delete S.lessons[ui.sel];ui.prac=null;save();break;
    case'addloc':case'addloc2':{const n=askName('新地點名稱');if(!n)return;S.locs.push(n);if(l&&a==='addloc')l.loc=n;save();break}
    case'delloc':S.locs.splice(+d.n,1);save();break;
    case'ren':{const n=askName('階段名稱',ph().name);if(!n)return;ph().name=n;save();break}
    case'delph':if(!confirm('刪除此階段與其中的動作？'))return;l.phases=l.phases.filter(p=>p.id!==d.p);save();break;
    case'addph':{const n=askName('新階段名稱');if(!n)return;l.phases.push({id:uid(),name:n,items:[]});save();break}
    case'add':ui.sheet=d.p;renderSheet();return;
    case'mask':case'closesheet':ui.sheet=null;renderSheet();return;
    case'pickex':{const e=S.lib.find(x=>x.id===d.e),p=l.phases.find(x=>x.id===ui.sheet);
      p.items.push({id:uid(),name:e.name,sets:e.sets,min:e.min});save();
      $('#app').innerHTML=views[ui.tab]();toast('已加入 '+e.name);return}
    case'custom':{const n=askName('動作名稱');if(!n)return;
      const e={id:uid(),name:n,sets:3,min:3};S.lib.push(e);
      l.phases.find(x=>x.id===ui.sheet).items.push({id:uid(),name:e.name,sets:e.sets,min:e.min});save();
      $('#app').innerHTML=views[ui.tab]();renderSheet();toast('已加入 '+n);return}
    case'st':{const x=item();x[d.k]=Math.max(1,+(x[d.k]+ +d.n).toFixed(1));save();break}
    case'mv':{const arr=ph().items,i=arr.findIndex(x=>x.id===d.i),j=i+ +d.n;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();break}
    case'rm':ph().items=ph().items.filter(x=>x.id!==d.i);save();break;
    case'addex':{const v=$('#newex').value.trim();if(!v)return;S.lib.push({id:uid(),name:v,sets:3,min:3});save();break}
    case'delex':if(!confirm('從動作庫刪除？（已排進課程的不受影響）'))return;S.lib=S.lib.filter(x=>x.id!==d.e);save();break;
    case'stl':{const e=S.lib.find(x=>x.id===d.e);e[d.k]=Math.max(1,+(e[d.k]+ +d.n).toFixed(1));save();break}
    case'pstart':ui.prac={date:ui.sel,i:0,left:flat()[0].min*60,run:true,el:{},done:false,t:Date.now()};break;
    case'ptog':{const p=ui.prac;p.run=!p.run;p.t=Date.now();break}
    case'pprev':go(ui.prac.i-1);break;
    case'pnext':go(ui.prac.i+1);break;
    case'papply':{const its=flat(),p=ui.prac;
      its.forEach((x,i)=>{if(p.el[i]){l.phases.forEach(ph=>ph.items.forEach(it=>{if(it.id===x.id)it.min=half(p.el[i])}))}});
      save();ui.prac=null;ui.tab='prep';toast('已更新預估時間');break}
    default:return;
  }
  render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='mask'&&e.target!==el)return;
  act(el.dataset.act,el.dataset);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='date'&&t.value){ui.sel=t.value;const [y,m]=t.value.split('-');ui.y=+y;ui.m=+m-1;render()}
  if(t.dataset.act==='loc'&&L()){L().loc=t.value;save()}
});
render();
</script>
